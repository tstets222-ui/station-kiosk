<style>
  /* --- 新增：登入頁面樣式 --- */
  #login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    background-color: #1a1a1e;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 9999;
  }

  .login-box {
    background-color: #232329;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    text-align: center;
    color: white;
    border: 1px solid #3a3a42;
    width: 300px;
  }

  .login-box h2 {
    margin-top: 0;
    color: #dfc5fe;
  }

  .login-box input {
    padding: 12px;
    margin: 20px 0;
    width: 80%;
    border: 1px solid #3a3a42;
    border-radius: 6px;
    background-color: #1c1c22;
    color: white;
    font-size: 16px;
    text-align: center;
  }

  .login-box button {
    padding: 12px 20px;
    width: 100%;
    background-color: #714299;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .login-box button:hover {
    background-color: #a354a0;
  }

  #error-msg {
    color: #ff4d4d;
    margin-top: 15px;
    font-size: 0.9em;
    display: none;
  }

  /* --- 1. 全局與版面配置 (左地圖、右列表) --- */
  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background-color: #1a1a1e;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* 將原本 body 的 flex 屬性移至 main-content */
  #main-content {
    display: none; /* 預設隱藏，登入後改為 flex */
    height: 100%;
    width: 100%;
  }

  /* 左側地圖可視窗口 */
  .map-viewport {
    flex: 1; /* 自動填滿剩餘空間 */
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    position: relative;
    background-color: #f4f4f9;
  }

  .map-viewport:active {
    cursor: grabbing;
  }

  /* 地圖容器 */
  .map-container {
    position: absolute;
    transform-origin: 0 0;
    will-change: transform;
  }

  .base-map {
    display: block;
  }

  /* --- 2. 右側商店列表側邊欄 --- */
  .sidebar {
    width: 320px;
    height: 100vh;
    background-color: #232329;
    border-left: 1px solid #3a3a42;
    display: flex;
    flex-direction: column;
    color: white;
    z-index: 100;
    box-shadow: -5px 0 15px rgba(0,0,0,0.3);
  }

  .sidebar-header {
    padding: 20px;
    background-color: #1c1c22;
    border-bottom: 1px solid #3a3a42;
  }

  .sidebar-header h2 {
    margin: 0;
    font-size: 1.3em;
    color: #dfc5fe;
  }

  .sidebar-content {
    flex: 1;
    overflow-y: auto; /* 允許垂直滾動查看 36 間商鋪 */
    padding: 15px;
  }

  .sidebar-section-title {
    font-size: 0.9em;
    font-weight: bold;
    color: #888;
    margin: 15px 5px 8px 5px;
    letter-spacing: 1px;
    border-left: 3px solid #888;
    padding-left: 8px;
  }
  
  /* 側邊欄各路線專屬顏色條 */
  .title-tst { border-color: #e60012; color: #ff4d4d; }
  .title-ets { border-color: #714299; color: #b886f2; }

  /* 列表單一項目樣式 */
  .sidebar-item {
    display: flex;
    align-items: center;
    padding: 12px;
    margin-bottom: 8px;
    background-color: #2c2c35;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .sidebar-item:hover {
    background-color: #383842;
    transform: translateX(-3px);
  }

  .sidebar-item.active {
    background-color: #3d3d4a;
    box-shadow: inset 0 0 0 2px #dfc5fe;
  }

  /* 列表內的數字小圖章 */
  .sidebar-badge {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 13px;
    margin-right: 12px;
    color: white;
    flex-shrink: 0;
  }

  .badge-tst { background-color: #e60012; }
  .badge-ets { background-color: #714299; }

  .sidebar-item-info {
    flex: 1;
    overflow: hidden;
  }

  .sidebar-item-name {
    font-weight: bold;
    font-size: 0.95em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-item-desc {
    font-size: 0.8em;
    color: #aaa;
    margin-top: 2px;
  }

  /* --- 3. 地圖上的 3D 數字按鈕 (已按比例放大) --- */
  .shop-hotspot {
    position: absolute;
    transform: translate(-50%, -50%); 
    z-index: 10;
  }

  .shop-box {
    width: 20px;  /* 從 15px 大幅放大至 32px */
    height: 20px; 
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 尖沙咀 TST 商店樣式：港鐵紅 */
  .shop-box.tst-style {
    background: linear-gradient(135deg, #ff4d4d, #e60012);
    border: 1.5px solid #ff9999;
    box-shadow: 0 3px 0px #99000b, 0 4px 8px rgba(0, 0, 0, 0.3);
  }

  /* 尖東 ETS 商店樣式：港鐵紫 */
  .shop-box.ets-style {
    background: linear-gradient(135deg, #a354a0, #714299);
    border: 1.5px solid #e1b3e1;
    box-shadow: 0 3px 0px #4a2373, 0 4px 8px rgba(0, 0, 0, 0.3);
  }

  .shop-box span {
    font-size: 15px; /* 數字加大 */
    color: white;
    font-weight: bold;
    font-family: "Arial Black", Gadget, sans-serif;
    user-select: none;
  }

  /* 按鈕選中/浮起效果 */
  .shop-box.active {
    transform: translateY(-8px) scale(1.2);
    border-color: #ffffff;
    box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4), 0 4px 0px #222; 
    z-index: 50;
  }

  /* --- 4. 浮動資訊視窗卡片 (已放大) --- */
  .info-window {
    position: absolute;
    bottom: 160%; 
    left: 50%;
    transform: translateX(-50%);
    width: 260px; /* 寬度從 200px 放大至 260px */
    background-color: rgba(30, 30, 36, 0.96); /* 高級暗黑玻璃質感 */
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    padding: 16px; /* 內邊距加大 */
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  .info-window::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -10px;
    border-width: 10px;
    border-style: solid;
    border-color: rgba(30, 30, 36, 0.96) transparent transparent transparent;
  }

  .info-window.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(-5px);
    pointer-events: auto;
    z-index: 100;
  }

  .info-window h4 {
    margin: 0 0 10px 0;
    font-size: 1.2em; /* 標題字體放大 */
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    padding-bottom: 6px;
    color: #f1e5ff;
  }

  .info-window p {
    margin: 6px 0;
    font-size: 0.95em; /* 內文內容量放大 */
    line-height: 1.4;
    color: #e0e0e6;
  }

        } else {
          baseMap.onload = initMapView;
        }
      } else {
        errorMsg.style.display = 'block';
      }
    });

    // 支援按 Enter 鍵登入
    pwdInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loginBtn.click();
      }
    });

    const mapContainer = document.getElementById('map-container');
    const mapViewport = document.getElementById('map-viewport');
    const sidebarContent = document.getElementById('sidebar-content');
    const baseMap = document.getElementById('base-map');

    let activeShopId = null;
    let elementsMap = {}; // 用於快速查閱 DOM 節點的對照表

    // --- 2. 建立右側列表的分類容器 ---
    const tstSection = document.createElement('div');
    tstSection.innerHTML = `<div class="sidebar-section-title title-tst">尖沙咀站 (TST)</div>`;
    const etsSection = document.createElement('div');
    etsSection.innerHTML = `<div class="sidebar-section-title title-ets">尖東站 (ETS)</div>`;
    
    sidebarContent.appendChild(tstSection);
    sidebarContent.appendChild(etsSection);

    // --- 3. 動態渲染地圖按鈕 & 側邊欄列表 ---
    shopsData.forEach(shop => {
      const isTST = shop.type === "TST";
      
      // A. 生成地圖按鈕圖層
      const hotspot = document.createElement('div');
      hotspot.className = 'shop-hotspot';
      hotspot.style.top = `${shop.top}%`;
      hotspot.style.left = `${shop.left}%`;

      hotspot.innerHTML = `
        <div class="shop-box ${isTST ? 'tst-style' : 'ets-style'}" id="box-${shop.id}">
          <span>${shop.icon}</span> 
        </div>
        <div class="info-window" id="window-${shop.id}">
          <h4>${shop.name || '未命名商鋪'}</h4>
          <p>📍 ${shop.location || '無位置資料'}</p>
          ${shop.phone.trim() ? `<p>📞 ${shop.phone}</p>` : ''}
          ${shop.time.trim() ? `<p>🕒 ${shop.time}</p>` : ''}
          ${shop.desc.trim() ? `<p>🛍️ ${shop.desc}</p>` : ''}
        </div>
      `;
      mapContainer.appendChild(hotspot);

      // B. 生成側邊欄列表項目
      const listItem = document.createElement('div');
      listItem.className = 'sidebar-item';
      listItem.id = `item-${shop.id}`;
      listItem.innerHTML = `
        <div class="sidebar-badge ${isTST ? 'badge-tst' : 'badge-ets'}">${shop.icon}</div>
        <div class="sidebar-item-info">
          <div class="sidebar-item-name">${shop.name || '空置鋪位 (Vacant)'}</div>
          <div class="sidebar-item-desc">${shop.location.split(',')[0]} · ${shop.desc || '零售'}</div>
        </div>
      `;
      
      if (isTST) {
        tstSection.appendChild(listItem);
      } else {
        etsSection.appendChild(listItem);
      }

      // 儲存 DOM 參考到對照表
      const box = hotspot.querySelector('.shop-box');
      const win = hotspot.querySelector('.info-window');
      elementsMap[shop.id] = { box, win, item: listItem, data: shop };

      // --- 4. 點擊邏輯 (地圖與列表共用一條核心邏輯) ---
      const triggerSelection = () => {
        handleShopSelect(shop.id);
      };

      box.addEventListener('mousedown', (e) => e.stopPropagation()); // 防止拖曳衝突
      box.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerSelection();
      });
      listItem.addEventListener('click', triggerSelection);
    });

    // 核心處理：選取某間商店時的動作（開關卡片、地圖平移聚焦、列表滾動切換）
    function handleShopSelect(shopId) {
      // 如果點擊的是同一個已打開的商店，則關閉它
      if (activeShopId === shopId) {
        clearActive();
        return;
      }

      // 關閉之前的商店
      clearActive();

      // 啟用現在選中的商店
      const current = elementsMap[shopId];
      if (!current) return;

      current.box.classList.add('active');
      current.win.classList.add('show');
      current.item.classList.add('active');
      activeShopId = shopId;

      // 側邊欄同步自動滾動到被點選的項目位置
      current.item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // 【全新自動聚焦聚焦算法】讓地圖平移並自動放大對齊畫面中央
      const imgWidth = baseMap.naturalWidth || baseMap.offsetWidth;
      const imgHeight = baseMap.naturalHeight || baseMap.offsetHeight;
      const shopX = (current.data.left / 100) * imgWidth;
      const shopY = (current.data.top / 100) * imgHeight;

      const vpWidth = mapViewport.offsetWidth;
      const vpHeight = mapViewport.offsetHeight;

      // 點選列表時自動放大到理想的 1.6 倍，並將商店拉到畫面中央
      scale = 1.6;
      pointX = vpWidth / 2 - shopX * scale;
      pointY = vpHeight / 2 - shopY * scale;

      updateTransform();
    }

    function clearActive() {
      if (activeShopId && elementsMap[activeShopId]) {
        const prev = elementsMap[activeShopId];
        prev.box.classList.remove('active');
        prev.win.classList.remove('show');
        prev.item.classList.remove('active');
        activeShopId = null;
      }
    }

    // 點擊地圖空白處關閉視窗
    mapViewport.addEventListener('click', (e) => {
      if (e.target.id === 'base-map' || e.target.id === 'map-viewport') {
        clearActive();
      }
    });

    // --- 5. 拖曳與滾輪縮放邏輯 (含新增的初始自動縮放置中) ---
    let scale = 1;      
    let pointX = 0;     
    let pointY = 0;     
    let start = { x: 0, y: 0 };
    let isDragging = false;

    function updateTransform() {
      mapContainer.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    // 初始化視角，讓圖片完整顯示在畫面中並置中
    function initMapView() {
      const vpWidth = mapViewport.offsetWidth;
      const vpHeight = mapViewport.offsetHeight;
      const imgWidth = baseMap.naturalWidth || baseMap.offsetWidth;
      const imgHeight = baseMap.naturalHeight || baseMap.offsetHeight;

      if (imgWidth > 0 && imgHeight > 0) {
        // 取寬高比例中較小的值，並乘上 0.95 留一點邊界留白
        scale = Math.min(vpWidth / imgWidth, vpHeight / imgHeight) * 0.95;
        // 計算置中需要的位移量
        pointX = (vpWidth - imgWidth * scale) / 2;
        pointY = (vpHeight - imgHeight * scale) / 2;
        updateTransform();
      }
    }

    mapViewport.addEventListener('mousedown', (e) => {
      // 只有當點擊地圖背景或視窗時才觸發拖曳
      if (e.target.id === 'base-map' || e.target.id === 'map-viewport') {
        e.preventDefault();
        start = { x: e.clientX - pointX, y: e.clientY - pointY };
        isDragging = true;
      }
    });

    document.addEventListener('mouseup', () => isDragging = false);

    mapViewport.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      pointX = e.clientX - start.x;
      pointY = e.clientY - start.y;
      updateTransform();
    });

    mapViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = e.deltaY || e.detail || e.wheelDelta;
      
      if (delta > 0) {
        scale *= 0.9;
      } else {
        scale *= 1.1;
      }
      scale = Math.max(0.1, Math.min(scale, 5)); // 稍微放寬最小縮放值到 0.1 以防超大圖片
      pointX = e.clientX - xs * scale;
      pointY = e.clientY - ys * scale;
      updateTransform();
    });

    // --- 6. 雙擊精準定位工具 (完整保留) ---
    mapContainer.addEventListener('dblclick', function(e) {
      if (e.target.id === 'base-map') {
        const rect = e.target.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        alert(`新商店座標 -> top: ${y.toFixed(2)}%, left: ${x.toFixed(2)}%`);
      }
    });
  });
</script>
